<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FF6B9D" id="themeColorMeta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Routine">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<title>Dawson's Morning</title>
<style>
  :root {
    --bg1: #FFE29A;
    --bg2: #FFB3C6;
    --bg3: #B5EAD7;
    --surface: rgba(255,255,255,0.9);
    --pink: #FF6B9D;
    --pink-dim: rgba(255,107,157,0.14);
    --orange: #FFB347;
    --orange-dim: rgba(255,179,71,0.16);
    --purple: #A78BFA;
    --purple-dim: rgba(167,139,250,0.16);
    --teal: #4ECDC4;
    --teal-dim: rgba(78,205,196,0.16);
    --blue: #5AA9E6;
    --blue-dim: rgba(90,169,230,0.16);
    --text: #3D2C4E;
    --text2: #7B6B8A;
    --text3: #B3A6C0;
    --border: rgba(61,44,78,0.08);
    --check-size: 26px;
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    font-family: 'Baloo 2', -apple-system, 'Helvetica Neue', sans-serif;
    color: var(--text);
    display: flex; flex-direction: column; min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%);
    background-attachment: fixed;
    position: relative;
    overflow-x: hidden;
  }
  body::before, body::after {
    content: ''; position: fixed; border-radius: 50%; filter: blur(2px); opacity: 0.5; pointer-events: none; z-index: 0;
  }
  body::before { width: 140px; height: 140px; background: radial-gradient(circle, #fff 0%, transparent 70%); top: -40px; right: -30px; }
  body::after { width: 100px; height: 100px; background: radial-gradient(circle, #fff 0%, transparent 70%); bottom: 10%; left: -30px; }

  header { padding: 8px 20px 0; position: relative; z-index: 1; }
  .greeting { font-size: 11px; color: var(--text2); font-weight: 700; margin-bottom: 0; }
  .name { font-size: 21px; font-weight: 800; color: var(--text); letter-spacing: -0.5px; }
  .name span { color: var(--pink); }

  .clock-row { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; padding: 6px 14px; background: var(--surface); border-radius: 14px; box-shadow: 0 4px 16px rgba(61,44,78,0.08); }
  .clock { font-size: 21px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }
  .depart-info { text-align: right; }
  .depart-label { font-size: 9px; color: var(--text3); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
  .depart-time { font-size: 13px; font-weight: 800; color: var(--orange); }
  .countdown { font-size: 9px; color: var(--text2); margin-top: 1px; font-weight: 700; }
  .countdown.urgent { color: #FF4D6D; }

  .progress-bar { height: 7px; background: rgba(255,255,255,0.5); margin: 6px 20px 0; border-radius: 10px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(61,44,78,0.1); position: relative; z-index: 1; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--pink), var(--orange), var(--teal)); border-radius: 10px; transition: width 0.5s cubic-bezier(.34,1.56,.64,1); }

  .steps { flex: 1; padding: 8px 16px 10px; display: flex; flex-direction: column; justify-content: center; gap: 6px; position: relative; z-index: 1; }
  .steps.long { justify-content: flex-start; padding-bottom: 20px; }

  .step {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface);
    border-radius: var(--radius);
    padding: 6px 14px;
    border: 2px solid transparent;
    box-shadow: 0 3px 10px rgba(61,44,78,0.07);
    transition: transform 0.15s ease, box-shadow 0.2s, opacity 0.2s, border-color 0.2s;
    cursor: pointer; user-select: none; -webkit-user-select: none;
  }
  .step:active { transform: scale(0.97); }
  .step.done { opacity: 0.55; box-shadow: none; }

  .step-icon-col { display: flex; flex-direction: column; align-items: center; gap: 2px; flex-shrink: 0; }
  .step-icon-wrap { width: 36px; height: 36px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0; }
  .icon-c0 { background: var(--pink-dim); }
  .icon-c1 { background: var(--orange-dim); }
  .icon-c2 { background: var(--purple-dim); }
  .icon-c3 { background: var(--blue-dim); }
  .icon-c4 { background: var(--teal-dim); }

  .check { width: var(--check-size); height: var(--check-size); border-radius: 50%; border: 3px solid #E4D9EE; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; order: 3; }
  .check svg { opacity: 0; transition: opacity 0.2s; transform: scale(0.6); }
  .step.done .check { background: linear-gradient(135deg, var(--teal), #3FBFB5); border-color: var(--teal); }
  .step.done .check svg { opacity: 1; transform: scale(1); }

  .step-body { flex: 1; min-width: 0; }
  .step-title { font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.2; }
  .step.done .step-title { color: var(--text3); text-decoration: line-through; }
  .step-sub { font-size: 11px; color: var(--text2); margin-top: 1px; font-weight: 500; }
  .step.done .step-sub { color: var(--text3); }
  .step-time { font-size: 13px; font-weight: 800; color: var(--pink); white-space: nowrap; font-variant-numeric: tabular-nums; background: var(--pink-dim); padding: 3px 9px; border-radius: 8px; letter-spacing: 0.01em; }
  .step.done .step-time { text-decoration: line-through; color: var(--text3); background: rgba(61,44,78,0.06); }
  .play-step .step-time { background: rgba(78,205,196,0.2); color: #1E8C82; }
  .play-step.locked .step-time { background: rgba(61,44,78,0.06); color: var(--text3); }

  .play-step { border-color: rgba(78,205,196,0.5) !important; background: linear-gradient(135deg, rgba(78,205,196,0.12), rgba(255,255,255,0.9)); }
  .play-step .step-title { color: #2A9D93; }
  .play-step:not(.done):not(.locked) { animation: glow 2.4s ease-in-out infinite; }
  @keyframes glow { 0%,100% { box-shadow: 0 3px 10px rgba(61,44,78,0.07); } 50% { box-shadow: 0 3px 18px rgba(78,205,196,0.35); } }

  .play-step.locked { border-color: var(--border) !important; background: rgba(255,255,255,0.55); filter: grayscale(0.85); opacity: 0.6; cursor: not-allowed; animation: none; box-shadow: none; }
  .play-step.locked .step-title { color: var(--text3); }
  .play-step.locked .step-icon-wrap { background: rgba(61,44,78,0.06); }
  .play-step.locked .check { border-color: #D8CFE0; }
  .play-step.shake { animation: shake 0.4s ease; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  .win-screen { display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; flex: 1; padding: 40px 30px; gap: 14px; position: relative; z-index: 1; }
  .win-screen.show { display: flex; }
  .win-icon { font-size: 84px; animation: bounce 1s ease infinite; }
  @keyframes bounce { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-14px) rotate(-6deg); } }
  .win-title { font-size: 30px; font-weight: 800; color: var(--pink); letter-spacing: -0.5px; }
  .win-sub { font-size: 17px; color: var(--text2); line-height: 1.5; font-weight: 600; }
  .win-time { font-size: 14px; color: var(--text3); font-weight: 700; }
  .reset-btn { margin-top: 12px; background: linear-gradient(135deg, var(--pink), var(--orange)); color: #fff; border: none; padding: 14px 32px; border-radius: 100px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; box-shadow: 0 6px 16px rgba(255,107,157,0.35); }
  .reset-btn:active { transform: scale(0.96); }

  .steps-wrap { display: flex; flex-direction: column; flex: 1; }

  .confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; overflow: hidden; }
  .confetti span { position: absolute; top: -20px; font-size: 20px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: 0.3; } }

  .header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .nav-stack { display: flex; gap: 8px; flex-shrink: 0; }
  .nav-link {
    width: 44px; height: 44px;
    border-radius: 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(61,44,78,0.18);
    text-decoration: none;
    gap: 0px;
    flex-shrink: 0;
  }
  .nav-link:active { transform: scale(0.94); }
  .nav-link .nav-icon { font-size: 17px; line-height: 1; }
  .nav-link .nav-label { font-size: 7px; font-weight: 800; color: #4A6B8A; letter-spacing: 0.01em; }
  .nav-link.calm { background: linear-gradient(135deg, #BFE1F5, #D6C8F0); }
  .nav-link.chores { background: linear-gradient(135deg, #FFF3B0, #C8EFC5); }
  .nav-link.stars { background: linear-gradient(135deg, #FFE9A8, #D9B8F0); }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div>
      <div class="greeting" id="pageGreeting">Good morning 👋</div>
      <div class="name" id="pageName">Dawson<span>'s</span> morning</div>
    </div>
    <div class="nav-stack">
      <a class="nav-link calm" href="calm.html" aria-label="Feeling upset? Go to Calm Corner">
        <span class="nav-icon">💙</span>
        <span class="nav-label">Calm</span>
      </a>
      <a class="nav-link chores" href="chores.html" aria-label="Go to Chores list">
        <span class="nav-icon">📋</span>
        <span class="nav-label">Chores</span>
      </a>
      <a class="nav-link stars" href="rewards.html" aria-label="Go to Rewards">
        <span class="nav-icon">⭐</span>
        <span class="nav-label">Stars</span>
      </a>
    </div>
  </div>
  <div class="clock-row">
    <div class="clock" id="clock">6:30</div>
    <div class="depart-info">
      <div class="depart-label" id="departLabel">leave by</div>
      <div class="depart-time" id="departTime">7:30</div>
      <div class="countdown" id="countdown"></div>
    </div>
  </div>
</header>

<div class="progress-bar">
  <div class="progress-fill" id="progress" style="width:0%"></div>
</div>

<div class="steps-wrap">
  <div class="steps" id="steps"></div>

  <div class="win-screen" id="win">
    <div class="win-icon" id="winIcon">🎉</div>
    <div class="win-title" id="winTitle">You did it, Dawson!</div>
    <div class="win-sub" id="winSub">Everything's done and you're ready to go.<br>Have an awesome day!</div>
    <div class="win-time" id="win-time"></div>
    <button class="reset-btn" onclick="reset()">Reset for tomorrow</button>
  </div>
</div>

<script>
const ROUTINES = {
  morning: {
    greeting: 'Good morning 👋',
    name: 'morning',
    endLabel: 'leave by',
    endTime: '7:30',
    endHour: 7, endMinute: 30,
    dueText: 'Time to go!',
    rewardField: 'morning',
    lockIndex: 5,
    lockedIcon: '🔒',
    unlockedIcon: '🌟',
    lockedSub: 'Finish everything above to unlock',
    unlockedSub: '15 minutes, anything you want',
    winIcon: '🎉',
    winTitle: 'You did it, Dawson!',
    winSub: "Everything's done and you're ready to go.<br>Have an awesome day!",
    resetLabel: 'Reset for tomorrow',
    palette: { bg1: '#FFE29A', bg2: '#FFB3C6', bg3: '#B5EAD7', pink: '#FF6B9D', 'pink-dim': 'rgba(255,107,157,0.14)', orange: '#FFB347' },
    themeColor: '#FF6B9D',
    steps: [
      { icon: '👕', title: 'Get dressed', sub: 'Clothes are already out', time: '6:35' },
      { icon: '🥣', title: 'Breakfast + Miralax water', sub: 'Drink them together', time: '6:55' },
      { icon: '🚽', title: 'Potty sit', sub: '5 minutes', time: '7:00' },
      { icon: '🦷', title: 'Brush teeth + floss', sub: 'Both!', time: '7:05' },
      { icon: '🎒', title: 'Shoes + backpack', sub: 'Bag was packed last night', time: '7:15' },
      { icon: '🌟', title: 'Free play — earned!', sub: '15 minutes, anything you want', time: '7:30' }
    ]
  },
  bedtime: {
    greeting: 'Good evening 🌙',
    name: 'bedtime',
    endLabel: 'lights out',
    endTime: '8:30',
    endHour: 20, endMinute: 30,
    dueText: 'Lights out!',
    rewardField: 'bedtime',
    lockIndex: 7,
    lockedIcon: '🔒',
    unlockedIcon: '🎮',
    lockedSub: 'Finish your bedtime routine to unlock',
    unlockedSub: '20 minutes, then lights out',
    winIcon: '🌙',
    winTitle: 'Great job, Dawson!',
    winSub: "Bedtime routine complete.<br>Sweet dreams!",
    resetLabel: 'Reset for tonight',
    palette: { bg1: '#B8C6F2', bg2: '#C9A6E8', bg3: '#6E8FD6', pink: '#8B6FD6', 'pink-dim': 'rgba(139,111,214,0.16)', orange: '#F2A93B' },
    themeColor: '#8B6FD6',
    steps: [
      { icon: '🙏', title: 'Prayer', sub: '', time: '7:00' },
      { icon: '🚿', title: 'Shower and pajamas', sub: '', time: '7:05' },
      { icon: '💊', title: 'Medicine', sub: '', time: '7:20' },
      { icon: '🦷', title: 'Brush teeth and floss', sub: '', time: '7:25' },
      { icon: '🚽', title: 'Potty sit', sub: '', time: '7:30' },
      { icon: '📖', title: 'Read for 20 minutes', sub: '', time: '7:35' },
      { icon: '❤️', title: 'Special time', sub: '', time: '7:55' },
      { icon: '🎮', title: 'Game Boy — earned!', sub: '20 minutes, then lights out', time: '8:20' },
      { icon: '🌙', title: 'Lights out', sub: '', time: '8:30' }
    ]
  }
};

const forcedRoutine = new URLSearchParams(location.search).get('routine');
const routineKey = (forcedRoutine === 'morning' || forcedRoutine === 'bedtime')
  ? forcedRoutine
  : ((new Date().getHours() < 12) ? 'morning' : 'bedtime');
const ROUTINE = ROUTINES[routineKey];
const TOTAL = ROUTINE.steps.length;
const CONFETTI_EMOJI = ['🎉','⭐','🎈','✨','🌈','🎊'];
let routineState;
let done;

function applyTheme() {
  const root = document.documentElement.style;
  for (const key in ROUTINE.palette) {
    root.setProperty('--' + key, ROUTINE.palette[key]);
  }
  document.getElementById('themeColorMeta').setAttribute('content', ROUTINE.themeColor);
  document.title = `Dawson's ${routineKey === 'morning' ? 'Morning' : 'Bedtime'}`;
  document.getElementById('pageGreeting').textContent = ROUTINE.greeting;
  document.getElementById('pageName').innerHTML = `Dawson<span>'s</span> ${ROUTINE.name}`;
  document.getElementById('departLabel').textContent = ROUTINE.endLabel;
  document.getElementById('departTime').textContent = ROUTINE.endTime;
}

function renderSteps() {
  const stepsEl = document.getElementById('steps');
  if (TOTAL > 6) stepsEl.classList.add('long');

  const lockReady = ROUTINE.lockIndex != null && done.slice(0, ROUTINE.lockIndex).every(Boolean);

  stepsEl.innerHTML = ROUTINE.steps.map((step, i) => {
    const isLock = ROUTINE.lockIndex === i;
    const locked = isLock && !lockReady;
    const icon = isLock ? (lockReady ? ROUTINE.unlockedIcon : ROUTINE.lockedIcon) : step.icon;
    const sub = isLock ? (lockReady ? ROUTINE.unlockedSub : ROUTINE.lockedSub) : step.sub;
    const classes = ['step'];
    if (isLock) classes.push('play-step');
    if (locked) classes.push('locked');
    if (done[i]) classes.push('done');
    const subHtml = sub ? `<div class="step-sub" id="sub${i}">${sub}</div>` : `<div class="step-sub" id="sub${i}"></div>`;
    return `
    <div class="${classes.join(' ')}" id="s${i}" onclick="toggle(${i})">
      <div class="step-icon-col"><div class="step-icon-wrap ${isLock ? '' : 'icon-c' + (i % 5)}" id="icon${i}">${icon}</div><div class="step-time">by ${step.time}</div></div>
      <div class="step-body">
        <div class="step-title">${step.title}</div>
        ${subHtml}
      </div>
      <div class="check"><svg width="16" height="16" viewBox="0 0 14 14" fill="none"><polyline points="2,7 5.5,10.5 12,3.5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </div>`;
  }).join('');
}

function toggle(i) {
  const el = document.getElementById('s' + i);

  if (i === ROUTINE.lockIndex && el.classList.contains('locked')) {
    el.classList.remove('shake');
    void el.offsetWidth;
    el.classList.add('shake');
    return;
  }

  done[i] = !done[i];
  el.classList.toggle('done', done[i]);
  if (done[i]) burstConfetti(el);

  if (ROUTINE.lockIndex != null && i !== ROUTINE.lockIndex) updatePlayLock();
  updateProgress();
  saveRoutineState();
  if (done.every(Boolean)) celebrate();
}

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function loadRoutineState() {
  let stored;
  try { stored = JSON.parse(localStorage.getItem('dawsonRoutineState') || 'null'); } catch (e) { stored = null; }
  const today = todayKey();
  if (stored && stored.date === today && stored.routineKey === routineKey && Array.isArray(stored.done) && stored.done.length === TOTAL) {
    done = stored.done.slice();
    routineState = { date: today, routineKey, done, finishedAt: stored.finishedAt || null };
  } else {
    done = new Array(TOTAL).fill(false);
    routineState = { date: today, routineKey, done, finishedAt: null };
  }
}

function saveRoutineState() {
  routineState.done = done;
  try { localStorage.setItem('dawsonRoutineState', JSON.stringify(routineState)); } catch (e) {}
}

function updatePlayLock() {
  const lockIndex = ROUTINE.lockIndex;
  const ready = done.slice(0, lockIndex).every(Boolean);
  const play = document.getElementById('s' + lockIndex);
  const icon = document.getElementById('icon' + lockIndex);
  const sub = document.getElementById('sub' + lockIndex);

  if (ready) {
    play.classList.remove('locked');
    icon.textContent = ROUTINE.unlockedIcon;
    sub.textContent = ROUTINE.unlockedSub;
  } else {
    play.classList.add('locked');
    icon.textContent = ROUTINE.lockedIcon;
    sub.textContent = ROUTINE.lockedSub;
    if (done[lockIndex]) {
      done[lockIndex] = false;
      play.classList.remove('done');
    }
  }
}

function burstConfetti(el) {
  const rect = el.getBoundingClientRect();
  const layer = document.createElement('div');
  layer.className = 'confetti';
  for (let i = 0; i < 10; i++) {
    const s = document.createElement('span');
    s.textContent = CONFETTI_EMOJI[Math.floor(Math.random() * CONFETTI_EMOJI.length)];
    s.style.left = (rect.left + Math.random() * rect.width) + 'px';
    s.style.top = (rect.top - 10) + 'px';
    s.style.animationDuration = (0.9 + Math.random() * 0.6) + 's';
    layer.appendChild(s);
  }
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), 1600);
}

function updateProgress() {
  const count = done.filter(Boolean).length;
  document.getElementById('progress').style.width = (count / TOTAL * 100) + '%';
}

function markRewardDay(field) {
  let data;
  try { data = JSON.parse(localStorage.getItem('dawsonRewards') || 'null'); } catch (e) { data = null; }
  if (!data || typeof data !== 'object' || !data.history) data = { history: {} };
  const key = todayKey();
  if (!data.history[key]) data.history[key] = { morning: false, chores: false, bedtime: false };
  data.history[key][field] = true;
  try { localStorage.setItem('dawsonRewards', JSON.stringify(data)); } catch (e) {}
}

function computeFinishText() {
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes().toString().padStart(2,'0');
  const ap = h >= 12 ? 'pm' : 'am';
  const h12 = h % 12 || 12;
  return `Finished at ${h12}:${m}${ap}`;
}

function applyWinDisplay(finishText) {
  document.getElementById('steps').style.display = 'none';
  const win = document.getElementById('win');
  win.classList.add('show');
  document.getElementById('winIcon').textContent = ROUTINE.winIcon;
  document.getElementById('winTitle').textContent = ROUTINE.winTitle;
  document.getElementById('winSub').innerHTML = ROUTINE.winSub;
  document.querySelector('.reset-btn').textContent = ROUTINE.resetLabel;
  document.getElementById('win-time').textContent = finishText || '';
}

function celebrate() {
  const finishText = computeFinishText();
  routineState.finishedAt = finishText;
  saveRoutineState();
  markRewardDay(ROUTINE.rewardField);
  applyWinDisplay(finishText);
  const layer = document.createElement('div');
  layer.className = 'confetti';
  for (let i = 0; i < 30; i++) {
    const s = document.createElement('span');
    s.textContent = CONFETTI_EMOJI[Math.floor(Math.random() * CONFETTI_EMOJI.length)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = '-20px';
    s.style.fontSize = (16 + Math.random() * 14) + 'px';
    s.style.animationDuration = (1.6 + Math.random() * 1.2) + 's';
    s.style.animationDelay = (Math.random() * 0.6) + 's';
    layer.appendChild(s);
  }
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), 3200);
}

function reset() {
  done.fill(false);
  for (let i = 0; i < TOTAL; i++) {
    document.getElementById('s' + i).classList.remove('done');
  }
  if (ROUTINE.lockIndex != null) updatePlayLock();
  routineState.finishedAt = null;
  saveRoutineState();
  document.getElementById('progress').style.width = '0%';
  document.getElementById('steps').style.display = 'flex';
  document.getElementById('win').classList.remove('show');
}

function tick() {
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes();
  const h12 = h % 12 || 12;
  const ms = m.toString().padStart(2,'0');
  document.getElementById('clock').textContent = `${h12}:${ms}`;

  const depart = new Date(now);
  depart.setHours(ROUTINE.endHour, ROUTINE.endMinute, 0, 0);
  const diff = Math.round((depart - now) / 60000);
  const cd = document.getElementById('countdown');
  if (diff > 0) {
    cd.textContent = `${diff} min left`;
    cd.className = 'countdown' + (diff <= 10 ? ' urgent' : '');
  } else if (diff === 0) {
    cd.textContent = ROUTINE.dueText;
    cd.className = 'countdown urgent';
  } else {
    cd.textContent = '';
  }
}

applyTheme();
loadRoutineState();
renderSteps();
if (ROUTINE.lockIndex != null) updatePlayLock();
updateProgress();
if (done.every(Boolean)) {
  markRewardDay(ROUTINE.rewardField);
  applyWinDisplay(routineState.finishedAt || computeFinishText());
}
tick();
setInterval(tick, 10000);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
</script>
</body>
</html>
