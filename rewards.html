<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFD08A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<title>Dawson's Rewards</title>
<style>
  :root {
    --bg1: #FFE9A8;
    --bg2: #FFD08A;
    --bg3: #D9B8F0;
    --surface: rgba(255,255,255,0.9);
    --gold: #F2A93B;
    --gold-dim: rgba(242,169,59,0.18);
    --purple: #A78BFA;
    --purple-dim: rgba(167,139,250,0.16);
    --pink: #E896B5;
    --text: #3D2C4E;
    --text2: #7B6B8A;
    --text3: #B3A6C0;
    --border: rgba(61,44,78,0.08);
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    font-family: 'Baloo 2', -apple-system, 'Helvetica Neue', sans-serif;
    color: var(--text);
    display: flex; flex-direction: column; min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 50%, var(--bg3) 100%);
    background-attachment: fixed;
    position: relative;
    overflow-x: hidden;
  }
  body::before, body::after {
    content: ''; position: fixed; border-radius: 50%; filter: blur(2px); opacity: 0.45; pointer-events: none; z-index: 0;
  }
  body::before { width: 160px; height: 160px; background: radial-gradient(circle, #fff 0%, transparent 70%); top: -50px; right: -40px; }
  body::after { width: 120px; height: 120px; background: radial-gradient(circle, #fff 0%, transparent 70%); bottom: 6%; left: -40px; }

  .nav-stack {
    position: fixed; top: max(10px, calc(env(safe-area-inset-top) + 6px)); right: 14px;
    display: flex; gap: 8px; z-index: 20;
  }
  .nav-link {
    width: 46px; height: 46px; border-radius: 15px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(61,44,78,0.18);
    text-decoration: none; gap: 1px; flex-shrink: 0;
  }
  .nav-link:active { transform: scale(0.94); }
  .nav-link .nav-icon { font-size: 18px; line-height: 1; }
  .nav-link .nav-label { font-size: 7px; font-weight: 800; color: #7A5A2A; letter-spacing: 0.01em; }
  .nav-link.calm { background: linear-gradient(135deg, #BFE1F5, #D6C8F0); }
  .nav-link.chores { background: linear-gradient(135deg, #FFF3B0, #C8EFC5); }

  header { padding: 22px 20px 4px; position: relative; z-index: 1; text-align: center; }
  .header-icon { font-size: 36px; }
  .greeting { font-size: 14px; color: var(--text2); font-weight: 700; margin-top: 4px; }
  .name { font-size: 26px; font-weight: 800; color: var(--text); letter-spacing: -0.5px; margin-top: 2px; }
  .name span { color: var(--gold); }
  .sub { font-size: 13px; color: var(--text2); font-weight: 600; margin-top: 6px; line-height: 1.4; }

  .stats { display: flex; gap: 12px; padding: 18px 20px 4px; position: relative; z-index: 1; }
  .stat-card { flex: 1; background: var(--surface); border-radius: var(--radius); padding: 16px 12px; text-align: center; box-shadow: 0 3px 10px rgba(61,44,78,0.07); }
  .stat-icon { font-size: 26px; }
  .stat-value { font-size: 30px; font-weight: 800; color: var(--text); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .stat-label { font-size: 11.5px; font-weight: 700; color: var(--text2); margin-top: 2px; }

  .message { text-align: center; font-size: 14px; font-weight: 700; color: var(--text); margin: 16px 24px 4px; line-height: 1.4; position: relative; z-index: 1; }

  .week-section { padding: 14px 20px 24px; position: relative; z-index: 1; }
  .week-title { font-size: 12.5px; font-weight: 800; color: var(--text2); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; padding-left: 4px; }
  .week-strip { display: flex; gap: 6px; }
  .day-card { flex: 1; background: var(--surface); border-radius: 14px; padding: 8px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; box-shadow: 0 2px 6px rgba(61,44,78,0.06); }
  .day-card.today { border: 2px solid var(--gold); }
  .day-label { font-size: 10px; font-weight: 800; color: var(--text2); }
  .day-star { font-size: 20px; opacity: 0.25; filter: grayscale(1); }
  .day-star.half { opacity: 0.65; filter: grayscale(0.4); }
  .day-star.full { opacity: 1; filter: none; }

  .back-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 10px 20px calc(env(safe-area-inset-bottom) + 14px); background: linear-gradient(to top, var(--bg3) 75%, transparent); }
  .back-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--surface); color: var(--text); text-decoration: none;
    font-weight: 800; font-size: 16px; padding: 14px 20px; border-radius: 100px;
    box-shadow: 0 4px 14px rgba(61,44,78,0.15);
    border: 2px solid rgba(242,169,59,0.4);
  }
  .back-btn:active { transform: scale(0.97); }
  .back-btn .back-icon { font-size: 19px; }

  .week-section { padding-bottom: 90px; }
</style>
</head>
<body>

<div class="nav-stack">
  <a class="nav-link calm" href="calm.html" aria-label="Feeling upset? Go to Calm Corner">
    <span class="nav-icon">💙</span>
    <span class="nav-label">Calm</span>
  </a>
  <a class="nav-link chores" href="chores.html" aria-label="Go to Chores list">
    <span class="nav-icon">📋</span>
    <span class="nav-label">Chores</span>
  </a>
</div>

<header>
  <div class="header-icon">🏆</div>
  <div class="greeting">Way to go!</div>
  <div class="name">Dawson<span>'s</span> Rewards</div>
  <div class="sub">Every star you've earned</div>
</header>

<div class="stats">
  <div class="stat-card">
    <div class="stat-icon">⭐</div>
    <div class="stat-value" id="totalStars">0</div>
    <div class="stat-label">Total Stars</div>
  </div>
  <div class="stat-card">
    <div class="stat-icon">🔥</div>
    <div class="stat-value" id="streak">0</div>
    <div class="stat-label">Day Streak</div>
  </div>
</div>

<div class="message" id="message"></div>

<div class="week-section">
  <div class="week-title">This week</div>
  <div class="week-strip" id="weekStrip"></div>
</div>

<div class="back-bar">
  <a class="back-btn" href="index.html"><span class="back-icon">🏠</span> Home</a>
</div>

<script>
function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function loadHistory() {
  let data;
  try { data = JSON.parse(localStorage.getItem('dawsonRewards') || 'null'); } catch (e) { data = null; }
  if (!data || typeof data !== 'object' || !data.history) data = { history: {} };
  return data.history;
}

function dayComplete(entry) {
  return !!(entry && entry.morning && entry.chores && entry.bedtime);
}

function computeStars(history) {
  let total = 0;
  for (const key in history) {
    const entry = history[key];
    if (entry.morning) total++;
    if (entry.chores) total++;
    if (entry.bedtime) total++;
  }
  return total;
}

function computeStreak(history) {
  const today = new Date();
  let streak = 0;
  let cursor = new Date(today);

  if (dayComplete(history[dateKey(cursor)])) {
    streak = 1;
  }
  cursor.setDate(cursor.getDate() - 1);

  while (dayComplete(history[dateKey(cursor)])) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

function buildWeekStrip(history) {
  const strip = document.getElementById('weekStrip');
  const dayLabels = ['S','M','T','W','T','F','S'];
  const today = new Date();
  const cells = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const key = dateKey(d);
    const entry = history[key] || {};
    const starsToday = (entry.morning ? 1 : 0) + (entry.chores ? 1 : 0) + (entry.bedtime ? 1 : 0);
    let starClass = '';
    if (starsToday === 3) starClass = 'full';
    else if (starsToday >= 1) starClass = 'half';
    const isToday = i === 0;
    cells.push(`<div class="day-card${isToday ? ' today' : ''}">
      <div class="day-label">${dayLabels[d.getDay()]}</div>
      <div class="day-star ${starClass}">⭐</div>
    </div>`);
  }
  strip.innerHTML = cells.join('');
}

function messageFor(streak, total) {
  if (streak >= 7) return "A whole week strong! You're amazing! 🎉";
  if (streak >= 3) return "You're on a roll! Keep it going! 🔥";
  if (total >= 1) return "Nice work! Every star counts. ⭐";
  return "Finish your morning routine, chores, and bedtime routine to earn your first star!";
}

const history = loadHistory();
const totalStars = computeStars(history);
const streak = computeStreak(history);

document.getElementById('totalStars').textContent = totalStars;
document.getElementById('streak').textContent = streak;
document.getElementById('message').textContent = messageFor(streak, totalStars);
buildWeekStrip(history);
</script>
</body>
</html>
